name: Build Windows Executable

on:
  push:
    branches:
      - build/v1.3.1-patched
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install datetime==5.5 ipinfo==5.1.1 matplotlib==3.10.3 pillow==11.2.1 pychromecast==14.0.7 pyinstaller==6.13.0 python-dateutil==2.9.0.post0 requests==2.32.3 segment-analytics-python==2.3.4 semver==3.0.4 sentry-sdk==2.22.0 watchdog==6.0.0

      - name: Run Build Script
        run: |
          python build.py
        env:
          SEGMENT_WRITE_KEY: "unknown"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wahoo-results-patched-windows
          path: wahoo-results.exe
