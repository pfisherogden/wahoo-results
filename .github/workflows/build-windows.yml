name: Build Windows Executable

on:
  push:
    branches:
      - build/latest-patched
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fonttools==4.63.0 ipinfo==5.6.0 pillow==12.2.0 pychromecast==14.0.10 pyinstaller==6.20.0 requests==2.34.2 segment-analytics-python==2.3.6 semver==3.0.4 sentry-sdk==2.60.0 watchdog==6.0.0

      - name: Run Build Script
        run: |
          python build.py
        env:
          SEGMENT_WRITE_KEY: "unknown"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wahoo-results-patched-windows
          path: wahoo-results.exe
